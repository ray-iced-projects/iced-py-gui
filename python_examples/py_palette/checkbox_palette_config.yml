# ============================================================================
# Checkbox Widget Palette Configuration (Part-Oriented)
# ============================================================================
# Defines palette mappings for checkbox widget parts and their status-specific rules.
# Organized by PART for easy querying of which statuses/variants use which palette tiers.

widget: checkbox

# Selected base color (rgba) used to generate the palette
selected_color: [0.32, 0.2, 0.13, 1.0]

# Widget metadata
metadata:
  description: "Checkbox widget palette configuration"
  palette_enabled: true

# Available statuses for this widget
statuses:
  - Active
  - Hovered
  - Disabled

# Available state variants
state_variants:
  - Unchecked
  - Checked

# Available style parts that can be customized
parts:
  - Background
  - Text
  - Border
  - Icon

# ============================================================================
# Palette Mappings (Part-Oriented)
# ============================================================================
# Each part defines rules for how different statuses/variants should be styled.
# For a given part, status, and variant, specifies which palette tier (key) to use.
#
# This structure allows easy querying:
#   "For part='Background' and status='Active', which palette tiers for each variant?"
#
# Format:
#   - part: <StylePart>
#     statuses:
#       <status>:
#         <variant>:
#           key: <PaletteKey>          # Which palette tier
#           alpha: <0.0 - 1.0>         # Transparency level
#           description: <string>      # Purpose/rationale

palette_mappings:

  # ========================================================================
  # Background Part - Checkbox background color
  # ========================================================================
  - part: Background
    statuses:
      Active:
        Unchecked:
          key: Base
          alpha: 1.0
          description: "Base background for unchecked state"
        Checked:
          key: Base
          alpha: 1.0
          description: "Base background for checked state"
      
      Hovered:
        Unchecked:
          key: Weak
          alpha: 1.0
          description: "Weak background on hover (unchecked)"
        Checked:
          key: Strong
          alpha: 1.0
          description: "Strong background on hover (checked)"
      
      Disabled:
        Unchecked:
          key: Weaker
          alpha: 1.0
          description: "Weaker background indicates disabled (unchecked)"
        Checked:
          key: Weak
          alpha: 1.0
          description: "Weak background indicates disabled (checked)"

  # ========================================================================
  # Text Part - Checkbox label text color
  # ========================================================================
  - part: Text
    statuses:
      Active:
        Unchecked:
          key: BaseText
          alpha: 0.8
          description: "Readable text on base background"
        Checked:
          key: BaseText
          alpha: 0.8
          description: "Readable text on base background"
      
      Hovered:
        Unchecked:
          key: BaseText
          alpha: 0.8
          description: "Text on weak background (unchecked)"
        Checked:
          key: BaseText
          alpha: 0.8
          description: "Text on strong background (checked)"
      
      Disabled:
        Unchecked:
          key: BaseText
          alpha: 0.8
          description: "Dimmed text on weaker background"
        Checked:
          key: BaseText
          alpha: 0.8
          description: "Dimmed text on weak background"

  # ========================================================================
  # Border Part - Checkbox border color
  # ========================================================================
  - part: Border
    statuses:
      Active:
        Unchecked:
          key: Strong
          alpha: 1.0
          description: "Border using strong palette tier"
        Checked:
          key: Strong
          alpha: 1.0
          description: "Border using strong palette tier"
      
      Hovered:
        Unchecked:
          key: Strong
          alpha: 1.0
          description: "Border on hover (unchecked)"
        Checked:
          key: Strong
          alpha: 1.0
          description: "Border on hover (checked)"
      
      Disabled:
        Unchecked:
          key: Strong
          alpha: 1.0
          description: "Border in disabled state (unchecked)"
        Checked:
          key: Strong
          alpha: 1.0
          description: "Border in disabled state (checked)"

  # ========================================================================
  # Icon Part - Checkmark icon color (only in Checked variant)
  # ========================================================================
  - part: Icon
    statuses:
      Active:
        Checked:
          key: BaseText
          alpha: 1.0
          description: "Icon contrasts with base background"
      
      Hovered:
        Checked:
          key: BaseText
          alpha: 1.0
          description: "Icon contrasts with strong background"
      
      Disabled:
        Checked:
          key: BaseText
          alpha: 1.0
          description: "Icon contrasts with weak background"

# ============================================================================
# Palette Key Tiers Reference
# ============================================================================
# Available palette keys for color selection:
#
# Color Tiers (from weakest to strongest):
#   - Weakest / WeakestText
#   - Weak / WeakText
#   - Base / BaseText
#   - Strong / StrongText
#   - Stronger / StrongerText
#   - Strongest / StrongestText
#
# Each tier is generated from the base color using the iced framework's
# readable() function to ensure WCAG contrast compliance.
