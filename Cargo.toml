[package]
authors = ["Charles Ray <ray-iced-projects@gmail.com>"]
name = "iced-py-gui"
version = "0.4.0"
edition = "2024"
license = "GNU"
description = "Python wrapper for Rust Iced"
readme = "README.md"

[lib]
name = "icedpygui"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["indexmap"] }
pyo3-stub-gen = "0.19.0"
iced = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11", features = [
    "advanced",
    "canvas",
    "highlighter",
    "image",
    "smol",
    "svg",
    "tokio",
] }
chrono = "0.4.44"
csv = "1"
indexmap = "2"
once_cell = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "*"
serde_yaml = "0.9"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.0", features = ["fs"] }

[features]
default = ["pyo3/extension-module"]
debug_log = []


[build-dependencies]
pyo3-build-config = { version = "0.26", features = ["resolve-config"] }

[profile.dev]
opt-level = 0
debug = false
lto = false
codegen-units = 256

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
