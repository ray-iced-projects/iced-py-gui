[package]
authors = ["Charles Ray <ray-iced-projects@gmail.com>"]
name = "iced-py-gui"
version = "0.4.0"
edition = "2024"
license = "GNU"
description = "Python wrapper for Rust Iced"
readme = "README.md"

[lib]
name = "icedpygui"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["indexmap"] }
indexmap = "2"
pyo3-stub-gen = "0.19.0"
iced = { git = "https://github.com/iced-rs/iced", rev = "a8ff2d522552c1252b88afc02bc310dd657cd25e", features = ["advanced", "canvas", "debug", "highlighter", "image", "lazy", "smol", "svg", "tokio"] }
tokio = { version = "1.0", features = ["fs"]}
csv = "1"
once_cell = "1.19.0"
chrono = "0.4.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "*"
serde_yaml = "0.9"
strum = { version = "0.28", features = ["derive"] }
native-dialog = { git = "https://github.com/native-dialog-rs/native-dialog-rs", features = ["async", "windows_dpi_awareness", "windows_visual_styles"] }
rfd = "0.17.2"

[features]
default = ["pyo3/extension-module"]

[build-dependencies]
pyo3-build-config = { version = "0.26", features = ["resolve-config"] }

[profile.dev]
opt-level = 0
debug = false
lto = false
codegen-units = 256

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
