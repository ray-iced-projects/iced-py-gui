# ============================================================================
# Button Widget Palette Configuration (Part-Oriented)
# ============================================================================
# Defines palette mappings for button widget parts and their status-specific rules.
# Organized by PART to easily query which statuses use which palette tiers.

widget: button

# Selected base color (rgba) used to generate the palette
selected_color: [0.32, 0.2, 0.13, 1.0]

# Widget metadata
metadata:
  description: "Button widget palette configuration"
  palette_enabled: true

# Available statuses for this widget
statuses:
  - Active
  - Hovered
  - Pressed
  - Disabled

# Available state variants
state_variants:
  - NoVariant

# Available style parts that can be customized
parts:
  - Background
  - Text
  - Border

# ============================================================================
# Palette Mappings (Part-Oriented)
# ============================================================================
# Each part defines rules for how different statuses should be styled.
# For a given part and status, specifies which palette tier (key) to use.
#
# This structure allows easy querying:
#   "For part='Background' and status='Active', which palette tier (key) is used?"
#
# Format:
#   - part: <StylePart>
#     statuses:
#       <status>:
#         key: <PaletteKey>          # Which palette tier (Base, Strong, Stronger, etc.)
#         alpha: <0.0 - 1.0>         # Transparency level
#         description: <string>      # Purpose/rationale for this choice

palette_mappings:

  # ========================================================================
  # Background Part - Controls the button's background color
  # ========================================================================
  - part: Background
    statuses:
      Active:
        key: Base
        alpha: 1.0
        description: "Base color for default button appearance"
      
      Hovered:
        key: Strong
        alpha: 1.0
        description: "Strong color to indicate hover state"
      
      Pressed:
        key: Base
        alpha: 1.0
        description: "Return to base for pressed state"
      
      Disabled:
        key: Base
        alpha: 0.5
        description: "Semi-transparent base indicates disabled"

  # ========================================================================
  # Text Part - Controls button text color
  # ========================================================================
  - part: Text
    statuses:
      Active:
        key: BaseText
        alpha: 0.8
        description: "Readable text on base background"
      
      Hovered:
        key: StrongText
        alpha: 0.8
        description: "High contrast text on strong background"
      
      Pressed:
        key: BaseText
        alpha: 0.8
        description: "Text consistent with base state"
      
      Disabled:
        key: BaseText
        alpha: 0.5
        description: "Dimmed text indicates disabled state"

  # ========================================================================
  # Border Part - Controls button border color
  # ========================================================================
  - part: Border
    statuses:
      Active:
        key: Stronger
        alpha: 1.0
        description: "Subtle border using stronger palette tier"
      
      Hovered:
        key: Strongest
        alpha: 1.0
        description: "Pronounced border on hover for emphasis"
      
      Pressed:
        key: Stronger
        alpha: 1.0
        description: "Border returns to stronger tier"
      
      Disabled:
        key: Stronger
        alpha: 0.5
        description: "Faded border indicates disabled state"

# ============================================================================
# Palette Key Tiers Reference
# ============================================================================
# Available palette keys for color selection:
#
# Color Tiers (from weakest to strongest):
#   - Weakest / WeakestText
#   - Weak / WeakText
#   - Base / BaseText
#   - Strong / StrongText
#   - Stronger / StrongerText
#   - Strongest / StrongestText
#
# Each tier is generated from the base color using the iced framework's
# readable() function to ensure WCAG contrast compliance.
